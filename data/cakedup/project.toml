description = "Build the website, order form, Google Sheet tracker, and brand kit. All TPM deliverables complete. Pending AT actions: run sheet script, take cake photos, host the website, add Instagram handle."
start_date  = "2026-02-19"
end_date    = "2026-03-04"
status      = "in_progress"
tpm_work    = "complete"
at_actions_remaining = ["run build_order_sheet.js in Google Sheets", "take 5+ cake photos", "host website (GitHub Pages)", "add Instagram handle to website", "execute Canva brand kit", "add Cash App handle to website"]

[[project.phases]]
id          = 2
name        = "Launch & Market"
description = "Host the website live. Set up Instagram and TikTok. Post first content. Announce to current customers. Get first 5 online orders."
start_date  = "2026-03-05"
end_date    = "2026-03-31"
status      = "not_started"

[[project.phases]]
id          = 3
name        = "Grow to $350"
description = "Execute marketing plan, refine pricing, grow monthly revenue from ~$100 to $350 via Birthday Pack upsells, referrals, and social media consistency."
