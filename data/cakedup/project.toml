notes = "7x revenue growth target. 3-Pack ($7) removed. Menu: $3 / $5 / $10 / $12–$15. Flavors: Carrot Cake, Berry Explosion, Cookies & Cream, Texas Vanilla Bean. Growth path: pre-order system + social media + Birthday Pack upsell."

[[project.phases]]
