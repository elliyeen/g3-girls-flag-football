[project]
id             = "cakedup"
name           = "Cake'd Up — Digital Transformation"
description    = "Transform a small junior cake business from a Google Sheet into a free online presence with a responsive website, embedded order form, Google Sheet tracker, and a marketing plan to grow monthly revenue from $50 to $350."
type           = "mixed"
project_scale  = "small"
overall_status = "in_progress"
start_date     = "2026-02-19"
target_end_date = "2026-04-30"
