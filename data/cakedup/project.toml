last_updated   = "2026-02-19"

[project.budget]
currency          = "USD"
total_budget      = 0.00
monthly_tool_cost = 0.00
notes             = "Free tools only — HTML/GitHub Pages, Google Forms, Google Sheets, Canva, Instagram, TikTok, Cash App. No paid subscriptions. Venmo removed by AT's decision."

[project.revenue_goal]
current_monthly      = 50.00
target_monthly       = 350.00
current_price_single = 3.00
current_price_pair   = 5.00
current_price_5pack  = 10.00
current_price_bday_standard = 12.00
